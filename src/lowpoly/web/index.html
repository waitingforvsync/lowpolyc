<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lowpoly</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 15 5 15 11 8 15 1 11 1 5Z' fill='%234a8df0'/%3E%3Cpath d='M8 1 8 8 15 5M8 8 1 5M8 8 8 15' stroke='%23fff' stroke-opacity='.5' fill='none'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --fg: #18181b;
        --muted: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
        }
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      /* The canvas fills the window; app.js matches its pixels to that size */
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Loading and errors, over the canvas */
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 0 16px;
        color: var(--muted);
        text-align: center;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <p id="status">Loading...</p>
    <script type="module" src="lowpoly.js"></script>
  </body>
</html>
